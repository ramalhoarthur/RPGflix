version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: rpgflix_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./project-rpgflix:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rpgflix_network
    restart: unless-stopped

networks:
  rpgflix_network:
    name: rpgflix_network
    driver: bridge