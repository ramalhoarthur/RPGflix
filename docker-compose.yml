version: '3.8'

services:
  # Frontend (Vite) - é o que o projeto tem de fato hoje
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: rpgflix_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./project-rpgflix:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true   # hot-reload confiável em alguns hosts (Windows/WSL)
    networks:
      - rpgflix_network
    restart: unless-stopped

